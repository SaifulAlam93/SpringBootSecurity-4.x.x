spring.application.name=SpringBootSecqurityEx

# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUVFNjcmV0S2V5Rm9yU3ByaW5nQm9vdDIwMjY=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin-patterns=http://localhost:4200


# =========================================================
# BOOTSTRAP USERS
# =========================================================

app.bootstrap.enabled=true
# ==============================
# ADMIN
# ==============================
app.bootstrap-admin.username=admin
app.bootstrap-admin.email=admin@gmail.com
app.bootstrap-admin.password=admin123


# ==============================
# MODERATOR
# ==============================
app.bootstrap-moderator.username=moderator
app.bootstrap-moderator.email=moderator@gmail.com
app.bootstrap-moderator.password=moderator123


# ==============================
# EMPLOYEE
# ==============================
app.bootstrap-employee.username=employee
app.bootstrap-employee.email=employee@gmail.com
app.bootstrap-employee.password=employee123


# ==============================
# NORMAL USER
# ==============================
app.bootstrap-user.username=user
app.bootstrap-user.email=user@gmail.com
app.bootstrap-user.password=user123


# ==============================
# PREMIUM USER
# ==============================
app.bootstrap-premium.username=premium
app.bootstrap-premium.email=premium@gmail.com
app.bootstrap-premium.password=premium123


# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sbs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# SERVER
# =========================================================
server.port=8080